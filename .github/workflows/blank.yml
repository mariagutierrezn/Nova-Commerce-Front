name: NovaCommerce Front CI

on:
  # Ejecutar en push a ramas principales
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

  # Ejecutar en Pull Requests hacia ramas principales
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

  # Permitir ejecución manual desde la UI de GitHub
  workflow_dispatch:

# Configuración de permisos mínimos (principio de menor privilegio)
permissions:
  contents: read
  pull-requests: read

# Cancelar workflows anteriores en la misma rama si hay un nuevo push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # JOB 1: BUILD & TEST
  # ====================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # Usar estrategia de matriz para testar en múltiples versiones (opcional)
    # strategy:
    #   matrix:
    #     node-version: [20.x, 22.x]

    steps:
      # ------------------------------------------------------------------
      # 1. Checkout del código fuente
      # ------------------------------------------------------------------
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch completo para análisis de cobertura y git blame
          fetch-depth: 0

      # ------------------------------------------------------------------
      # 2. Setup de Node.js con cache automático de npm
      # ------------------------------------------------------------------
      - name: 🟢 Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'  # LTS actual (Enero 2026)
          cache: 'npm'
          cache-dependency-path: 'nova-commerce-front/package-lock.json'

      # ------------------------------------------------------------------
      # 3. Verificar versiones instaladas (útil para debugging)
      # ------------------------------------------------------------------
      - name: 📋 Display versions
        run: |
          node --version
          npm --version
          echo "Working directory: $(pwd)"
        working-directory: ./nova-commerce-front

      # ------------------------------------------------------------------
      # 4. Instalación de dependencias (npm ci = clean install)
      # ------------------------------------------------------------------
      - name: 📦 Install dependencies
        run: npm ci
        working-directory: ./nova-commerce-front

      # ------------------------------------------------------------------
      # 5. Ejecutar linting
      # ------------------------------------------------------------------
      # Nota: Angular 21 no incluye ESLint por defecto
      # Si tienes ESLint configurado, descomenta esta sección:
      #
      # - name: 🔍 Run linting
      #   run: npm run lint
      #   working-directory: ./nova-commerce-front
      #
      # Si no tienes lint configurado, puedes validar TypeScript:
      - name: 🔍 TypeScript compilation check
        run: npx tsc --noEmit
        working-directory: ./nova-commerce-front

      # ------------------------------------------------------------------
      # 6. Ejecutar tests unitarios con cobertura
      # ------------------------------------------------------------------
      - name: 🧪 Run unit tests with coverage
        run: npm run test:coverage
        working-directory: ./nova-commerce-front
        env:
          # Variables de entorno para Vitest
          CI: true

      # ------------------------------------------------------------------
      # 7. Verificar cobertura mínima del 80%
      # ------------------------------------------------------------------
      - name: 📊 Check coverage threshold
        run: |
          # Extraer porcentaje de cobertura del reporte de Vitest
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -pe "JSON.parse(require('fs').readFileSync('coverage/coverage-summary.json')).total.lines.pct")
            echo "Coverage: $COVERAGE%"

            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "❌ Error: Code coverage ($COVERAGE%) is below the required threshold (80%)"
              exit 1
            else
              echo "✅ Coverage check passed: $COVERAGE%"
            fi
          else
            echo "⚠️ Warning: coverage-summary.json not found, skipping coverage check"
          fi
        working-directory: ./nova-commerce-front
        shell: bash

      # ------------------------------------------------------------------
      # 8. Build de producción
      # ------------------------------------------------------------------
      - name: 🏗️ Build production
        run: npm run build -- --configuration production
        working-directory: ./nova-commerce-front
        env:
          # Evitar warnings de memoria en CI
          NODE_OPTIONS: "--max_old_space_size=4096"

      # ------------------------------------------------------------------
      # 9. Verificar que el build generó archivos
      # ------------------------------------------------------------------
      - name: ✅ Verify build output
        run: |
          if [ -d "dist/nova-commerce-front/browser" ]; then
            echo "✅ Build output directory exists"
            ls -lh dist/nova-commerce-front/browser
          else
            echo "❌ Build output directory not found"
            exit 1
          fi
        working-directory: ./nova-commerce-front

      # ------------------------------------------------------------------
      # 10. Publicar artefacto: Coverage
      # ------------------------------------------------------------------
      - name: 📤 Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()  # Subir incluso si tests fallan
        with:
          name: coverage-report-${{ github.sha }}
          path: nova-commerce-front/coverage/
          retention-days: 30
          if-no-files-found: warn

      # ------------------------------------------------------------------
      # 11. Publicar artefacto: Build de producción
      # ------------------------------------------------------------------
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()  # Solo si todo pasó
        with:
          name: build-artifacts-${{ github.sha }}
          path: nova-commerce-front/dist/
          retention-days: 30
          compression-level: 9  # Máxima compresión

      # ------------------------------------------------------------------
      # 12. Comentar cobertura en PR (opcional)
      # ------------------------------------------------------------------
      # Requiere permisos: pull-requests: write
      # - name: 💬 Comment coverage on PR
      #   if: github.event_name == 'pull_request'
      #   uses: actions/github-script@v7
      #   with:
      #     script: |
      #       const fs = require('fs');
      #       const coveragePath = 'nova-commerce-front/coverage/coverage-summary.json';
      #       if (fs.existsSync(coveragePath)) {
      #         const coverage = JSON.parse(fs.readFileSync(coveragePath));
      #         const pct = coverage.total.lines.pct;
      #         github.rest.issues.createComment({
      #           issue_number: context.issue.number,
      #           owner: context.repo.owner,
      #           repo: context.repo.repo,
      #           body: `## 📊 Coverage Report\n\nTotal Coverage: **${pct}%**\n\n${pct >= 80 ? '✅' : '❌'} Threshold: 80%`
      #         });
      #       }

  # ====================================================================
  # JOB 2: BUILD SUCCESS SUMMARY (opcional)
  # ====================================================================
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: 📊 Build Summary
        run: |
          echo "## 🎉 NovaCommerce Front CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ needs.build-and-test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.build-and-test.result }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed. Please review the logs.**" >> $GITHUB_STEP_SUMMARY
          fi
