<section class="admin-layout" *hasRole="'ADMIN'">
  <!-- === SIDEBAR (DARK MODE) === -->
  <aside class="admin-sidebar">
    <!-- Logo -->
    <div class="admin-sidebar__header">
      <div class="admin-sidebar__logo">
        <div class="admin-sidebar__logo-icon">N</div>
        <span class="admin-sidebar__brand">Nova</span>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="admin-sidebar__nav">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="admin-sidebar__link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/admin/products" routerLinkActive="active" class="admin-sidebar__link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        <span>Productos</span>
      </a>

      <a routerLink="/admin/orders" routerLinkActive="active" class="admin-sidebar__link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Pedidos</span>
      </a>

      <a routerLink="/admin/customers" routerLinkActive="active" class="admin-sidebar__link">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Clientes</span>
      </a>

      <a routerLink="/admin/discounts" routerLinkActive="active" class="admin-sidebar__link admin-sidebar__link--highlight">
        <svg class="nav-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
          <line x1="7" y1="7" x2="7.01" y2="7"></line>
        </svg>
        <span>Descuentos</span>
      </a>
    </nav>

    <!-- Footer -->
    <div class="admin-sidebar__footer">
      <div class="admin-sidebar__user">
        <div class="admin-sidebar__user-avatar">A</div>
        <div class="admin-sidebar__user-info">
          <span class="admin-sidebar__user-name">Admin</span>
          <span class="admin-sidebar__user-role">Administrador</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- === TOP BAR (DARK MODE) === -->
  <header class="admin-topbar">
    <div class="admin-topbar__search">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input 
        type="text" 
        placeholder="Buscar productos..." 
        class="admin-topbar__search-input"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()">
    </div>

    <div class="admin-topbar__actions">
      <!-- Messages -->
      <button class="admin-topbar__icon-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <!-- Notifications -->
      <button class="admin-topbar__icon-btn admin-topbar__icon-btn--notification">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="admin-topbar__badge">3</span>
      </button>

      <!-- User profile -->
      <div class="admin-topbar__user">
        <span class="admin-topbar__username">Admin</span>
        <div class="admin-topbar__avatar">A</div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
  </header>

  <!-- === MAIN CONTENT AREA === -->
  <main class="admin-main">
    <router-outlet></router-outlet>
  </main>
</section>
