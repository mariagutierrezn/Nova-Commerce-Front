<div class="nc-login">
  <div class="nc-login__container">
    <!-- Logo geométrico moderno -->
    <div class="nc-login__header">
      <div class="nc-login__logo">
        <img class="nc-login__logo-img" src="/logo.svg" alt="NovaCommerce" />
      </div>
      <h1 class="nc-login__title">Iniciar Sesión</h1>
      <p class="nc-login__subtitle">Accede a tu cuenta de NovaCommerce</p>
    </div>

    <!-- Formulario de login -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="nc-login__form">
      <!-- Campo Usuario -->
      <div class="nc-login__field">
        <label for="userIdentifier" class="nc-login__label">Usuario</label>
        <div class="nc-login__input-wrapper">
          <svg class="nc-login__input-icon" viewBox="0 0 20 20" fill="currentColor">
            <path d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"/>
          </svg>
          <input
            type="text"
            id="userIdentifier"
            formControlName="userIdentifier"
            class="nc-login__input"
            [class.nc-login__input--error]="hasError('userIdentifier', 'required') || hasError('userIdentifier', 'minlength')"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
          />
        </div>
        <span class="nc-login__error" *ngIf="loginForm.get('userIdentifier')?.touched && loginForm.get('userIdentifier')?.invalid">
          {{ getErrorMessage('userIdentifier') }}
        </span>
      </div>

      <!-- Campo Contraseña -->
      <div class="nc-login__field">
        <label for="password" class="nc-login__label">Contraseña</label>
        <div class="nc-login__input-wrapper">
          <svg class="nc-login__input-icon" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
          </svg>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="nc-login__input"
            [class.nc-login__input--error]="hasError('password', 'required') || hasError('password', 'minlength')"
            placeholder="Ingresa tu contraseña"
            autocomplete="current-password"
          />
        </div>
        <span class="nc-login__error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          {{ getErrorMessage('password') }}
        </span>
      </div>

      <!-- Mensaje de error global -->
      <div class="nc-login__alert" *ngIf="errorMessage">
        <svg class="nc-login__alert-icon" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Botón de submit -->
      <button
        type="submit"
        class="nc-login__button"
        [disabled]="isLoading"
        [class.nc-login__button--loading]="isLoading"
      >
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="nc-login__spinner-wrapper">
          <svg class="nc-login__spinner" viewBox="0 0 24 24">
            <circle class="nc-login__spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none" />
          </svg>
          Cargando...
        </span>
      </button>
    </form>

    <!-- Divisor -->
    <div class="nc-login__divider">
      <span class="nc-login__divider-text">o continúa con</span>
    </div>

    <!-- Botones de Login Social -->
    <div class="nc-login__social">
      <button type="button" class="nc-login__social-btn" (click)="loginWithGoogle()" aria-label="Continuar con Google">
        <svg class="nc-login__social-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
      </button>
      <button type="button" class="nc-login__social-btn" (click)="loginWithApple()" aria-label="Continuar con Apple">
        <svg class="nc-login__social-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
        </svg>
      </button>
    </div>

    <!-- Footer: enlace de registro -->
    <div class="nc-login__footer">
      <p class="nc-login__footer-text">
        ¿No tienes cuenta?
        <a routerLink="/auth/register" class="nc-login__register-link">Crear cuenta</a>
      </p>
    </div>
  </div>
</div>
