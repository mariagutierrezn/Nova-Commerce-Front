version: '3.8'

services:
  # Frontend Angular
  frontend:
    build:
      context: ./nova-commerce-front
      dockerfile: Dockerfile
    container_name: nova-frontend
    ports:
      - "4200:80"
    environment:
      # Puedes configurar aquí la URL del backend externo
      # Por defecto apunta a localhost:8080 (backend local)
      API_GATEWAY_URL: ${API_GATEWAY_URL:-http://host.docker.internal:8080}
    networks:
      - nova-frontend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  nova-frontend-network:
    driver: bridge
